services:
  neo4j:
    image: neo4j:5-community
    container_name: aeropower-neo4j
    ports:
      - "7474:7474"   # HTTP Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-aeropower_rag_2026}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./scripts/neo4j:/import    # 导入脚本挂载
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-aeropower_rag_2026}", "MATCH (n) RETURN count(n) LIMIT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # AeroPower-RAG 后端（依赖 Neo4j 就绪）
  app:
    build: .
    container_name: aeropower-app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-aeropower_rag_2026}
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - full   # docker compose --profile full up
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
