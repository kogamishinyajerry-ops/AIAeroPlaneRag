name: E2E Tests (Playwright)

on:
  push:
    branches: ["codex/**", "main", "develop"]
  pull_request:
    branches: ["main", "develop", "codex/v0.1.0-initial-release"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "Playwright E2E — 5 关键路径"
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      # Disable external service connections in CI
      OLLAMA_API_KEY: ""
      EMBEDDING_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      JINA_API_KEY: ""
      APP_MODE: "mock"
      CI: "true"
      BASE_URL: "http://localhost:8000"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python + FastAPI backend ──────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all project deps; ignore optional extras that may fail
          pip install -r requirements.txt --ignore-requires-python 2>/dev/null || true
          # Ensure core FastAPI stack is present regardless
          pip install \
            fastapi "uvicorn[standard]" httpx python-dotenv \
            pydantic chromadb requests pdfminer.six

      - name: Verify backend can import
        run: |
          python -c "from src.main import app; print('FastAPI app imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 3. Node + Playwright ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 4. Run E2E tests ─────────────────────────────────────────────────
      # playwright.config.js has webServer that auto-starts uvicorn before tests.
      # Tests use page.route() to intercept /api/v1/query with mock responses,
      # so no real LLM or ChromaDB connection is required for CI.
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list,json --project=chromium
        env:
          PYTHONPATH: ${{ github.workspace }}
          REPO_ROOT: ${{ github.workspace }}

      # ── 5. Artifacts ─────────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            benchmarks/e2e_report.json
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: test-results/
          retention-days: 7
